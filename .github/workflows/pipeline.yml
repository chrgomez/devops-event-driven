name: Build and Push Microservices

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with: { java-version: '17', distribution: 'temurin' }

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Construcción de cada servicio ---
      - name: Build and Push Task Service
        run: |
          mvn clean package -DskipTests -f task-service/pom.xml
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/task-service:latest -f task-service/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/task-service:latest

      - name: Build and Push Notification Service
        run: |
          mvn clean package -DskipTests -f notification-service/pom.xml
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest -f notification-service/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:latest

      - name: Build and Push Analytics Service
        run: |
          mvn clean package -DskipTests -f analytics-service/pom.xml
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest -f analytics-service/Dockerfile .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/analytics-service:latest

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest -f frontend/Dockerfile ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app:latest
