# Si la variable de entorno est\u00e1 presente (Docker), la usa; si no, usa localhost
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
server.port=8082
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Esto permite que Spring env\u00c3\u00ade objetos Java autom\u00c3\u00a1ticamente como JSON
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.auto-offset-reset=earliest
# Aseg\u00farate de que el group-id sea diferente a otros servicios
spring.kafka.consumer.group-id=analytics-group
management.endpoints.web.exposure.include=prometheus,health
management.endpoint.prometheus.enabled=true
